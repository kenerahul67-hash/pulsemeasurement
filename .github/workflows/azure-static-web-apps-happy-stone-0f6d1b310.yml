name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Deploy Static Website
    steps:
      - name: Checkout public repository without GitHub token
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Prepare static artifact
        run: |
          mkdir -p dist
          cp *.html staticwebapp.config.json robots.txt sitemap.xml dist/
          cp -r assets dist/

      - name: Deploy with Azure Static Web Apps CLI
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_STONE_0F6D1B310 }}
        run: npx -y @azure/static-web-apps-cli@latest deploy ./dist --env production
