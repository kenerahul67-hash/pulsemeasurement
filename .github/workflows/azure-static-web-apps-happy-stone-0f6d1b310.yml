name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Static Website
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static artifact
        run: |
          mkdir -p dist
          cp index.html staticwebapp.config.json dist/

      - name: Deploy with Azure Static Web Apps CLI
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_STONE_0F6D1B310 }}
        run: npx -y @azure/static-web-apps-cli@latest deploy ./dist --env production
